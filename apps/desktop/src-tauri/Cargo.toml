[package]
name = "family-meals-helper"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
rusqlite = { version = "0.42", features = ["bundled"] }
keyring = "4.2"
serde_json = "1"

# Déjà présent par `keyring` (même version, verrouillée dans Cargo.lock) : sert seulement à lire le code d'erreur
# macOS d'un refus du trousseau (secrets.rs).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", default-features = false }
