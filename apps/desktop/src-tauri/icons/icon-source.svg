<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#EF5B2A"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8EC"/>
      <stop offset="1" stop-color="#F4E3C8"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E8E5E"/>
      <stop offset="1" stop-color="#2B6E45"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#7A2A0C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- fond : carré arrondi à la grille macOS (824 px, marge 100) -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>

  <!-- vapeur -->
  <g fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" opacity="0.92">
    <path d="M420 330 C 390 290, 450 260, 420 215"/>
    <path d="M512 315 C 482 270, 542 240, 512 190"/>
    <path d="M604 330 C 574 290, 634 260, 604 215"/>
  </g>

  <g filter="url(#shadow)">
    <!-- poignées -->
    <rect x="226" y="520" width="110" height="56" rx="28" fill="#2B6E45"/>
    <rect x="688" y="520" width="110" height="56" rx="28" fill="#2B6E45"/>
    <!-- cuve de la cocotte -->
    <path d="M286 470 H738 V640 C738 728, 676 780, 588 780 H436 C348 780, 286 728, 286 640 Z" fill="url(#pot)"/>
    <!-- bandeau -->
    <rect x="286" y="560" width="452" height="34" fill="#EF5B2A" opacity="0.85"/>
    <!-- couvercle -->
    <path d="M262 470 C 262 410, 352 370, 512 370 C 672 370, 762 410, 762 470 Z" fill="url(#lid)"/>
    <rect x="252" y="458" width="520" height="34" rx="17" fill="#2B6E45"/>
    <!-- bouton du couvercle -->
    <rect x="472" y="336" width="80" height="44" rx="22" fill="#FFF8EC"/>
  </g>

</svg>
